<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>LLM Chat Exporter — Options</title>
    <style>
      body {
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 560px;
        margin: 32px auto;
        padding: 0 16px;
        color: #1a1a1a;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 13px;
        margin: 24px 0 8px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      .hint {
        color: #6b7280;
        font-size: 12px;
        margin: 4px 0 12px 22px;
      }
      .hint-block {
        color: #6b7280;
        font-size: 12px;
        margin: 4px 0 12px 0;
      }
      button {
        margin-top: 16px;
        padding: 8px 16px;
        border: 1px solid #6366f1;
        border-radius: 6px;
        background: #6366f1;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #4f46e5;
      }
      #savedMsg {
        margin-left: 12px;
        color: #059669;
        font-size: 13px;
      }

      /* Per-adapter override sections ------------------------------------ */
      .adapter-section {
        border: 1px solid #e5e7eb;
        border-radius: 6px;
        margin: 8px 0;
        padding: 0;
        background: #fafafa;
      }
      .adapter-section > summary {
        list-style: none;
        cursor: pointer;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        user-select: none;
        font-size: 13px;
        border-radius: 6px;
      }
      .adapter-section > summary::-webkit-details-marker {
        display: none;
      }
      .adapter-section > summary::before {
        content: "▸";
        display: inline-block;
        color: #9ca3af;
        font-size: 10px;
        width: 10px;
        transition: transform 0.1s;
      }
      .adapter-section[open] > summary::before {
        transform: rotate(90deg);
      }
      .adapter-section > summary:hover {
        background: #f3f4f6;
      }
      .adapter-name {
        font-weight: 600;
      }
      .adapter-overrides-count {
        color: #9ca3af;
        font-size: 12px;
        font-weight: 400;
      }
      .adapter-overrides-count.has-overrides {
        color: #6366f1;
        font-weight: 500;
      }
      .adapter-body {
        padding: 4px 14px 14px;
        border-top: 1px solid #e5e7eb;
        background: #fff;
      }
      .options-grid {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px 16px;
        align-items: center;
        margin: 10px 0 4px;
      }
      .options-grid .opt-label {
        font-size: 13px;
        color: #1a1a1a;
      }
      .options-grid select {
        font: inherit;
        font-size: 13px;
        padding: 4px 6px;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: #fff;
        min-width: 130px;
      }
      .options-grid select:focus {
        outline: 2px solid #6366f1;
        outline-offset: -1px;
      }
      .options-grid select[data-modified="true"] {
        border-color: #6366f1;
        background: #eef2ff;
      }
      .reset-btn {
        margin-top: 10px;
        padding: 4px 10px;
        font-size: 12px;
        background: #fff;
        color: #6b7280;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 400;
      }
      .reset-btn:hover {
        background: #f3f4f6;
        color: #1a1a1a;
      }
      .reset-btn:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>LLM Chat Exporter — Options</h1>

    <h2>Global defaults</h2>
    <p class="hint" style="margin-left: 0">
      These values pre-fill the popup. You can still override them per export.
    </p>

    <label>Default format:</label>
    <label><input type="radio" name="mode" value="md" /> Markdown (.md)</label>
    <label><input type="radio" name="mode" value="zip" /> ZIP archive</label>

    <label style="margin-top: 12px">
      <input type="checkbox" id="includeReasoning" />
      Include reasoning by default (thinking + tool calls)
    </label>

    <label style="margin-top: 8px">
      <input type="checkbox" id="inlineImages" />
      Embed images in the export by default
    </label>

    <label style="margin-top: 8px">
      <input type="checkbox" id="inlineTextFiles" />
      Inline uploaded text files by default (.md, .txt, .json…)
    </label>

    <label style="margin-top: 8px">
      <input type="checkbox" id="attachmentsAsMarkdown" />
      Render attachments as Markdown (no code block) by default
    </label>

    <h2>Per-adapter overrides</h2>
    <p class="hint-block">
      Force specific options when exporting from a given LLM. "Inherit" means
      the global default above applies for that adapter.
    </p>
    <div id="perAdapterContainer"></div>

    <button id="saveBtn">Save</button>
    <span id="savedMsg" hidden>Saved.</span>

    <script src="../core/settings.js"></script>
    <script src="options.js"></script>
  </body>
</html>
